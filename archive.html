<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Archive · BioTender</title>

<style>
:root{
  --bg-0:#f4f2ee;
  --bg-1:#fbfaf7;
  --ink:#0b0b0b;
  --muted:#4b4b4b;
  --soft:#7a7a7a;
  --line:rgba(0,0,0,.08);
  --max:1000px;
}

*{ box-sizing:border-box; }
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
               "PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 700px at 20% 20%, rgba(0,0,0,.05), transparent 55%),
    radial-gradient(1000px 700px at 80% 30%, rgba(0,0,0,.04), transparent 60%),
    linear-gradient(180deg, var(--bg-1), var(--bg-0));
  -webkit-font-smoothing: antialiased;
}

a{ text-decoration:none; color:inherit; }

.wrap{
  width:min(var(--max), calc(100% - 64px));
  margin:0 auto;
}

.topbar{
  padding:28px 0 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size: clamp(18px, 3vw, 48px);
  font-weight:950;
  letter-spacing:-.06em;
  color:var(--ink);
}

.nav{
  display:flex;
  gap:28px;
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--soft);
}

.nav a:hover{ color:var(--ink); }

.hero{
  padding:6vh 0 2vh;
  text-align:left;
}

.title{
  margin:0;
  font-size: clamp(60px, 12vw, 120px);
  font-weight:950;
  letter-spacing:-.06em;
  line-height:.95;
  margin-bottom:3vh;
}

section{
  padding:40px 0 80px;
}

.post{
  padding:28px 0;
  border-top:1px solid var(--line);
}

.post h3{
  margin:0 0 8px;
  font-size:26px;
  font-weight:900;
  letter-spacing:-.015em;
}

.post h3 a{
  color:var(--ink);
  border-bottom:2px solid transparent;
  transition:border-color 0.2s;
}

.post h3 a:hover{
  border-bottom-color:var(--ink);
}

.category{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--soft);
  margin-bottom:8px;
}

.meta{
  font-size:12px;
  color:var(--soft);
}

footer{
  padding:60px 0 40px;
  text-align:center;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--soft);
}
</style>
</head>

<body>

<div class="wrap">

<div class="topbar">
  <span class="brand">BioTender</span>
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="archive.html">Archive</a>
    <a href="about.html">About</a>
  </div>
</div>

<div class="hero">
  <h1 class="title">Archive</h1>
</div>

<section>
  <!-- 文章会由自动化系统生成到这里 -->
  <div style="text-align: center; padding: 60px 0; color: var(--soft);">
    <p style="font-size: 14px;">暂无文章。首篇文章将由自动化系统生成。</p>
  </div>
</section>

<footer>
  © 2026 BioRadar AI · Powered by BioTender
</footer>

</div>

</body>
</html>
