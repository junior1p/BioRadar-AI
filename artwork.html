<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Artwork · BioTender</title>

<style>
:root{
  --bg-0:#f4f2ee;
  --bg-1:#fbfaf7;
  --ink:#0b0b0b;
  --muted:#4b4b4b;
  --soft:#7a7a7a;
  --line:rgba(0,0,0,.08);
  --max:1000px;
}

*{ box-sizing:border-box; }
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
               "PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 700px at 20% 20%, rgba(0,0,0,.05), transparent 55%),
    radial-gradient(1000px 700px at 80% 30%, rgba(0,0,0,.04), transparent 60%),
    linear-gradient(180deg, var(--bg-1), var(--bg-0));
  -webkit-font-smoothing: antialiased;
}

a{ text-decoration:none; color:inherit; }

.wrap{
  width:min(var(--max), calc(100% - 64px));
  margin:0 auto;
}

.topbar{
  padding:28px 0 0;
  display:flex;
  justify-content:center;
  gap:28px;
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--soft);
}

.topbar a:hover{ color:var(--ink); }

.hero{
  padding:6vh 0 2vh;
  text-align:left;
}

.title{
  margin:0;
  font-size: clamp(60px, 12vw, 120px);
  font-weight:950;
  letter-spacing:-.06em;
  line-height:.95;
  margin-bottom:3vh;
}

.desc{
  font-size:16px;
  line-height:1.8;
  color:var(--muted);
  margin-bottom:40px;
}

section{
  padding:40px 0 80px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
  gap:30px;
}

.artwork-item{
  overflow:hidden;
  border-radius:8px;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  transition:transform 0.3s, box-shadow 0.3s;
}

.artwork-item:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 16px rgba(0,0,0,.12);
}

.artwork-image{
  display:block;
  width:100%;
  height:280px;
  background:#f0f0f0;
  object-fit:cover;
}

.artwork-title{
  padding:20px;
  font-size:16px;
  font-weight:700;
  line-height:1.5;
}

footer{
  padding:60px 0 40px;
  text-align:center;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--soft);
}
</style>
</head>

<body>

<div class="wrap">

<div class="topbar">
  <a href="index.html">Home</a>
  <a href="archive.html">Archive</a>
  <a href="about.html">About</a>
</div>

<div class="hero">
  <h1 class="title">Artwork</h1>
  <div class="desc">
    每篇文章的视觉表达。通过 AI 生成的封面设计，呈现 BioTender 的视角。
  </div>
</div>

<section>
  <div style="text-align: center; padding: 80px 0; color: var(--muted);">
    <p style="font-size: 16px; margin-bottom: 20px;">此功能已下线</p>
    <p style="font-size: 14px; color: var(--soft);">我们专注于提供高质量的文字内容</p>
  </div>
</section>

<footer>
  © 2026 BioRadar AI · Powered by BioTender
</footer>

</div>

</body>
</html>
